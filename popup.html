<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>本地网页标记</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="brand"><span class="logo">◇</span><div><h1>本地网页标记</h1><p>数据仅保存在当前浏览器</p></div></div>
    <button id="page-bookmark" type="button">收藏当前网页</button>
  </header>
  <button id="collapse-panel" type="button" aria-label="收起侧栏" title="收起侧栏">›</button>
  <main>
    <nav class="scope-tabs" aria-label="查看范围"><button id="scope-current" class="active">本页标注</button><button id="scope-all">全部标记</button></nav>
    <section id="detail" hidden aria-label="标注详情">
      <div class="detail-heading"><h2>标注详情</h2><button id="detail-close" aria-label="关闭详情">×</button></div>
      <blockquote id="detail-quote"></blockquote>
      <label>类型<select id="detail-mode"><option value="highlight">高亮</option><option value="underline-solid">直线</option><option value="underline-wavy">波浪线</option><option value="bookmark">书签</option></select></label>
      <div class="detail-controls"><label>颜色<input id="detail-color" type="color"></label><label>粗细 <output id="detail-thickness-value"></output><input id="detail-thickness" type="range" step="1"></label><label>透明度 <output id="detail-opacity-value"></output><input id="detail-opacity" type="range" min="10" max="100" step="1"></label></div>
      <label for="detail-note">笔记</label><textarea id="detail-note" maxlength="10000" placeholder="写下理解、疑问或待复习内容……"></textarea>
      <div class="detail-actions"><button id="detail-save">保存笔记</button><button id="detail-locate">定位原文</button></div><p id="detail-status" role="status" aria-live="polite"></p>
    </section>
    <details class="backup" id="backup-panel">
      <summary>详细设置</summary>
      <label class="entry-setting">网页入口<select id="entry-side"><option value="right">右侧</option><option value="left">左侧</option><option value="hidden">隐藏（通过扩展图标打开）</option></select></label>
      <p>标记只存在本机。导出文件含网址、选中文字和笔记，请妥善保存。</p>
      <div class="backup-actions"><button id="export-data" type="button">导出 JSON</button><button id="import-data" type="button">导入 JSON</button></div>
      <label class="backup-option"><input id="import-styles" type="checkbox"> 同时恢复标记样式（覆盖本机样式）</label>
      <input id="import-file" type="file" accept=".json,application/json" hidden>
      <p class="backup-status" id="backup-status" role="status" aria-live="polite"></p>
      <div class="clear-settings">
        <button id="clear-all" class="danger-button" type="button">清空所有标记</button>
        <div id="clear-confirmation" hidden>
          <p id="clear-description"></p>
          <div class="backup-actions"><button id="clear-cancel" type="button">取消</button><button id="clear-confirm" class="danger-button" type="button">确认清空</button></div>
        </div>
      </div>
    </details>
    <input id="search" type="search" placeholder="搜索网页、原文或笔记" aria-label="搜索全部标记">
    <div class="filters" id="filters">
      <button class="active" data-filter="all">全部</button>
      <button data-filter="page">网页</button>
      <button data-filter="bookmark">书签</button>
      <button data-filter="mark">标注</button>
      <button data-filter="note">笔记</button>
    </div>
    <label class="grouping-control">分组方式<select id="grouping" aria-label="标记分组方式"><option value="page">按网页</option><option value="site">按网站</option><option value="none">按时间，不分组</option></select></label>
    <p class="summary" id="summary"></p>
    <ul id="records"></ul>
  </main>
  <footer><span>选中网页文字即可标记</span><button id="open-page-panel" type="button">独立管理页</button></footer>
  <script src="mark-styles.js"></script>
  <script src="backup.js"></script>
  <script src="record-groups.js"></script>
  <script src="popup.js"></script>
  <script src="sidepanel.js"></script>
</body>
</html>
