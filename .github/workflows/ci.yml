name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Syntax and unit checks
        run: |
          for file in *.js *.mjs; do node --check "$file"; done
          python3 -B -m unittest test_chrome_local_marks.py
          for file in test_chrome_backup.mjs test_record_groups.mjs test_mark_styles.mjs test_sidepanel_background.mjs test_record_store.mjs; do node "$file"; done
      - name: Build and verify package
        run: |
          python3 -B package_release.py
          python3 -B - <<'PY'
          import json, pathlib, zipfile
          from package_release import RELEASE_FILES
          root = pathlib.Path('.')
          version = json.loads((root / 'manifest.json').read_text())['version']
          with zipfile.ZipFile(root / 'dist' / f'chrome-local-marks-release-{version}.zip') as archive:
              assert set(archive.namelist()) == set(RELEASE_FILES)
              assert 'LICENSE' in archive.namelist()
              for name in archive.namelist():
                  assert archive.read(name) == (root / 'dist/chrome-local-marks-unpacked' / name).read_bytes()
          PY
